[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-pdm-mlops"
version = "0.1.0"
description = "MLOps pipeline (MLflow tracking + registry, FastAPI serving, drift → auto-retrain) over synthetic predictive-maintenance telemetry from can-telemetry-forge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jorge Ribeiro" }]
keywords = [
    "mlops",
    "mlflow",
    "model-registry",
    "drift-detection",
    "predictive-maintenance",
    "fastapi",
    "prefect",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
# Core training/tracking deps. The model layer (D4) is two cheap estimators:
# scikit-learn (LogisticRegression baseline) + LightGBM (contender). MLflow is the
# tracking + registry spine; pyarrow reads the committed sample parquet.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16", "mypy>=1.14"]
# Serving (F4): FastAPI app exposing the promoted model. `python-multipart` powers the
# F8 bring-your-own-data multipart upload (`POST /demo/upload`); httpx is the test client.
serve = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "python-multipart>=0.0.9"]
# Drift monitoring + orchestration (F5): Evidently drift report, Prefect flow.
# Evidently is CAPPED below 0.7: 0.7.0 rewrote the public API (the `Report` +
# `metric_preset` + `as_dict()` surface `monitor.py` targets was replaced), so the pin
# keeps the code and the installed library in agreement across machines — the same
# reproducibility discipline as the generator pin (ADR-001/ADR-013).
ops = ["evidently>=0.4,<0.7", "prefect>=2.16"]
# Hyper-parameter search (F2.6): the Optuna study behind `pdm tune`. matplotlib renders
# the diagnostic PNGs; it is optional — diagnostics fall back to numeric CSVs without it,
# so the core install and CI stay light (ADR-006).
tune = ["optuna>=3.4", "matplotlib>=3.7"]
# Deep outlier rung (F2.5): the CPU-only PyTorch autoencoder in the detection ladder.
# Optional and kept OUT of core CI — the ladder runs (and signal_suspect is computed)
# without it via the cheap multivariate + temporal rungs (ADR-005). CPU build only;
# no GPU/CUDA on the production desktop.
deep = ["torch>=2.0"]
# Managed-cloud prediction log (F7): the demo UI's persistence on Cloud SQL for Postgres
# behind Cloud Run (ADR-015). SQLAlchemy Core + the psycopg 3 driver; the SAME code runs
# against a local SQLite file in tests. Kept OUT of core CI and every non-cloud deploy —
# the demo degrades gracefully to no persistence when DATABASE_URL is unset (store_pg.py),
# so nothing here is a hard dependency of serving.
cloud = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
# Live data regeneration (D1): import the companion generator to produce the FULL
# training dataset from configs/dataset.json + a seed, and to move the `season`
# drift knob. The version is PINNED so desktop and notebook regenerate
# byte-identical data (ADR-001) — "same config" only reproduces if the generator
# version matches too. The package still runs fully offline against the committed
# smoke fixture without this extra; CI never installs it.
generate = ["can-telemetry-forge==0.2.0"]

[project.scripts]
pdm = "pdm_mlops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
# Static analysis. Enforced in CI — see .github/workflows/ci.yml.
# The rule set is curated rather than "ALL": every rule here is one the repo
# actually passes, so a red gate always means a new defect, never a backlog.
# Widening the set is a deliberate change, not a wish (see docs/DECISIONS.md).
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "PIE", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings — the reports use box-drawing glyphs
    "RUF002",
    "RUF003",
    "SIM108",  # ternary is not always more readable than if/else
    # E501 is deliberately OFF. `ruff format` is NOT enforced here: reformatting
    # ~33k lines would rewrite history for `git blame`, and the commit log is a
    # working engineering record. Without a formatter, line length is the least
    # informative rule in the set, and every real violation left is an embedded
    # CSS/JS block, a base64 asset or a test fixture — none of which read better
    # wrapped. The rules that catch defects (F, B, UP, SIM, RET, C4, RUF) stay on.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom IS a function call in an argument default
# (`file: UploadFile = File(...)`). Ruff's B008 is correct in general and wrong
# for FastAPI route signatures specifically.
"src/pdm_mlops/serve.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["pdm_mlops"]

[tool.mypy]
# Set to 3.12 because numpy's shipped stubs use PEP 695 `type` statements that
# mypy refuses to parse under an older target — it fails on the stub before it ever
# reaches this code. The package still supports 3.11; that is proven by the CI test
# matrix running there, which is a stronger check than a type-checker flag.
python_version = "3.12"
files = ["src"]
# SCOPE, stated because it is easy to read this gate as broader than it is: only
# `src/` is checked. Test code is NOT type-checked (running mypy over tests/ today
# reports errors). Widening it is real work, not a flag flip, and is queued rather
# than claimed. "mypy clean" here means "src/ is clean".
ignore_missing_imports = true
# Ratchet, not a wall: these are the levels the code passes TODAY and CI holds.
# Tightening happens per-module (see [[tool.mypy.overrides]]) so the gate stays
# green and every step forward is a real, reviewed change.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
